<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Requests - Admin Panel</title>
<style>
  body { font-family: Arial, sans-serif; background: #f3f4f6; padding: 20px; }
  h1 { color: #3b82f6; text-align: center; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px; border: 1px solid #ccc; text-align: center; }
  th { background: #10b981; color: white; }
  button { padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; }
  .verify { background: #059669; color: white; }
  .reject { background: #ef4444; color: white; }
</style>
</head>
<body>

<h1>✅ Verify Requests</h1>

<table id="verifyTable">
  <thead>
    <tr>
      <th>User ID</th>
      <th>Name</th>
      <th>TxnID</th>
      <th>Date/Time</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    <!-- Firebase Data Will Appear Here -->
  </tbody>
</table>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyBEbzvJ5asGNPp85_Uyvk1N_TCjIBfECXY",
    authDomain: "studentbestincome.firebaseapp.com",
    databaseURL: "https://studentbestincome-default-rtdb.firebaseio.com",
    projectId: "studentbestincome",
    storageBucket: "studentbestincome.firebasestorage.app",
    messagingSenderId: "261636758539",
    appId: "1:261636758539:web:faea7afabe319a53117b0e",
    measurementId: "G-6L77EJ7MJF"
  };

  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const tableBody = document.querySelector("#verifyTable tbody");

  db.ref('verify').on('value', snapshot => {
    tableBody.innerHTML = "";
    snapshot.forEach(child => {
      const data = child.val();
      const tr = document.createElement('tr');

      tr.innerHTML = `
        <td>${data.userId}</td>
        <td>${data.name}</td>
        <td>${data.txnId}</td>
        <td>${data.date}</td>
        <td>
          <button class="verify">Verified</button>
          <button class="reject">Rejected</button>
        </td>
      `;

      tr.querySelector('.verify').onclick = () => {
        db.ref('verify/' + child.key).update({ status: 'Verified' });
        db.ref('users/' + data.userId).update({ verified: true });
      };

      tr.querySelector('.reject').onclick = () => {
        db.ref('verify/' + child.key).update({ status: 'Rejected' });
      };

      tableBody.appendChild(tr);
    });
  });
</script>

</body>
</html>
