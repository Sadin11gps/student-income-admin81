<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Verify Requests</title>
<style>
body { font-family: Arial; background:#f0f9ff; padding:20px;}
h2 { color:#3b82f6; }
.request-card { background:#e0f2fe; padding:15px; margin:10px 0; border-radius:10px;}
button { padding:5px 10px; margin:5px; cursor:pointer; border:none; border-radius:5px;}
.verify-btn { background:#10b981; color:white;}
.reject-btn { background:#ef4444; color:white;}
img { max-width:200px; display:block; margin-top:5px; }
</style>
</head>
<body>

<h2>📝 Verify Requests</h2>
<div id="requestsContainer">Loading...</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBEbzvJ5asGNPp85_Uyvk1N_TCjIBfECXY",
  authDomain: "studentbestincome.firebaseapp.com",
  databaseURL: "https://studentbestincome-default-rtdb.firebaseio.com",
  projectId: "studentbestincome",
  storageBucket: "studentbestincome.firebasestorage.app",
  messagingSenderId: "261636758539",
  appId: "1:261636758539:web:faea7afabe319a53117b0e",
  measurementId: "G-6L77EJ7MJF"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const requestsContainer = document.getElementById('requestsContainer');

// Load all verify requests in real-time
db.ref('admin/verify_requests').on('value', snapshot=>{
    requestsContainer.innerHTML = '';
    if(snapshot.exists()){
        const data = snapshot.val();
        Object.keys(data).forEach(uid=>{
            const req = data[uid];
            const card = document.createElement('div');
            card.className = 'request-card';
            card.innerHTML = `
                <strong>User ID:</strong> ${req.userId}<br>
                <strong>Number/Email:</strong> ${req.userNumber}<br>
                <strong>Txn ID:</strong> ${req.txnId}<br>
                <img src="${req.screenshotURL}" alt="Screenshot">
                <button class="verify-btn" onclick="approve('${uid}')">Verified</button>
                <button class="reject-btn" onclick="reject('${uid}')">Rejected</button>
            `;
            requestsContainer.appendChild(card);
        });
    } else {
        requestsContainer.innerText = 'No verify requests found';
    }
});

// Approve request
function approve(uid){
    db.ref('users/' + uid + '/verify_requests').update({status:'verified'});
    db.ref('admin/verify_requests/' + uid).remove();
}

// Reject request
function reject(uid){
    db.ref('users/' + uid + '/verify_requests').update({status:'rejected'});
    db.ref('admin/verify_requests/' + uid).remove();
}
</script>

</body>
</html>
