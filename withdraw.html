<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw Requests - Admin Panel</title>
<style>
  body { font-family: Arial, sans-serif; background: #f3f4f6; padding: 20px; }
  h1 { color: #3b82f6; text-align: center; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px; border: 1px solid #ccc; text-align: center; }
  th { background: #10b981; color: white; }
  button { padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; }
  .approve { background: #059669; color: white; }
  .reject { background: #ef4444; color: white; }
</style>
</head>
<body>

<h1>💰 Withdraw Requests</h1>

<table id="withdrawTable">
  <thead>
    <tr>
      <th>User ID</th>
      <th>Name</th>
      <th>Method</th>
      <th>Number</th>
      <th>Amount</th>
      <th>Date/Time</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    <!-- Firebase Data Will Be Injected Here -->
  </tbody>
</table>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyBEbzvJ5asGNPp85_Uyvk1N_TCjIBfECXY",
    authDomain: "studentbestincome.firebaseapp.com",
    databaseURL: "https://studentbestincome-default-rtdb.firebaseio.com",
    projectId: "studentbestincome",
    storageBucket: "studentbestincome.firebasestorage.app",
    messagingSenderId: "261636758539",
    appId: "1:261636758539:web:faea7afabe319a53117b0e",
    measurementId: "G-6L77EJ7MJF"
  };

  // Initialize Firebase
  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const tableBody = document.querySelector("#withdrawTable tbody");

  // Fetch Withdraw Requests in real-time
  db.ref('withdraw').on('value', snapshot => {
    tableBody.innerHTML = ""; // Clear previous rows
    snapshot.forEach(child => {
      const data = child.val();
      const tr = document.createElement('tr');

      tr.innerHTML = `
        <td>${data.userId}</td>
        <td>${data.name}</td>
        <td>${data.method}</td>
        <td>${data.number}</td>
        <td>${data.amount}</td>
        <td>${data.date}</td>
        <td>
          <button class="approve">Approve</button>
          <button class="reject">Reject</button>
        </td>
      `;

      // Approve Button
      tr.querySelector('.approve').onclick = () => {
        // Deduct amount from user balance
        db.ref('users/' + data.userId + '/balance').once('value', snap => {
          let balance = snap.val() || 0;
          balance -= Number(data.amount);
          db.ref('users/' + data.userId).update({ balance });
        });
        // Update withdraw status
        db.ref('withdraw/' + child.key).update({ status: 'Approved' });
      };

      // Reject Button
      tr.querySelector('.reject').onclick = () => {
        db.ref('withdraw/' + child.key).update({ status: 'Rejected' });
      };

      tableBody.appendChild(tr);
    });
  });
</script>

</body>
</html>
