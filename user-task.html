<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Tasks - Admin Panel</title>
<style>
  body { font-family: Arial, sans-serif; background: #f0f9ff; padding: 20px; }
  h1 { text-align: center; color: #3b82f6; }
  .task-card { background: #fff; padding: 15px; margin: 15px auto; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 800px; }
  .task-card img { max-width: 100%; margin: 10px 0; border-radius: 5px; }
  .task-info { margin-bottom: 10px; }
  .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; margin-right: 5px; font-weight: bold; }
  .approve { background: #10b981; color: white; }
  .reject { background: #ef4444; color: white; }
  .date { font-size: 12px; color: #6b7280; }
</style>
</head>
<body>

<h1>📝 User Tasks</h1>
<div id="taskContainer"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBEbzvJ5asGNPp85_Uyvk1N_TCjIBfECXY",
    authDomain: "studentbestincome.firebaseapp.com",
    databaseURL: "https://studentbestincome-default-rtdb.firebaseio.com",
    projectId: "studentbestincome",
    storageBucket: "studentbestincome.firebasestorage.app",
    messagingSenderId: "261636758539",
    appId: "1:261636758539:web:faea7afabe319a53117b0e",
    measurementId: "G-6L77EJ7MJF"
  };

  // Initialize Firebase
  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const taskContainer = document.getElementById("taskContainer");

  // Fetch tasks in real-time
  db.ref('tasks').on('value', snapshot => {
    taskContainer.innerHTML = '';
    snapshot.forEach(taskSnap => {
      const task = taskSnap.val();
      const taskId = taskSnap.key;

      const card = document.createElement('div');
      card.className = 'task-card';

      card.innerHTML = `
        <div class="task-info"><strong>Username:</strong> ${task.username}</div>
        <div class="task-info"><strong>Task:</strong> ${task.taskName}</div>
        <div class="task-info"><strong>Number/Email:</strong> ${task.userContact}</div>
        <div class="task-info"><strong>Submitted At:</strong> <span class="date">${task.timestamp}</span></div>
        <div>
          <strong>Screenshot Before:</strong><br>
          <img src="${task.screenshotBefore}" alt="Before">
        </div>
        <div>
          <strong>Screenshot After:</strong><br>
          <img src="${task.screenshotAfter}" alt="After">
        </div>
        <div style="margin-top:10px;">
          <button class="btn approve" onclick="updateTaskStatus('${taskId}', 'Approved', ${task.reward}, '${task.userId}')">Approve</button>
          <button class="btn reject" onclick="updateTaskStatus('${taskId}', 'Rejected')">Reject</button>
        </div>
        <div class="task-info"><strong>Status:</strong> ${task.status || 'Pending'}</div>
      `;
      taskContainer.appendChild(card);
    });
  });

  function updateTaskStatus(taskId, status, reward = 0, userId = null) {
    const taskRef = db.ref('tasks/' + taskId);

    if(status === 'Approved' && userId) {
      const userRef = db.ref('users/' + userId);
      userRef.once('value').then(userSnap => {
        const user = userSnap.val();
        let newBalance = (user.balance || 0) + reward;
        userRef.update({ balance: newBalance });
      });
    }

    taskRef.update({ status: status })
      .then(() => alert('Task ' + status))
      .catch(err => alert('Error: ' + err));
  }
</script>

</body>
</html>
