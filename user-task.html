<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Task - Admin Panel</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
  body { font-family: Arial, sans-serif; padding:20px; background:#f3f4f6; }
  header { text-align:center; font-size:24px; font-weight:bold; color:#3b82f6; margin-bottom:20px; }
  .card { background:white; padding:15px; margin-bottom:15px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
  .card img { width:120px; margin-right:10px; border-radius:5px; }
  .btn { padding:8px 12px; margin-right:5px; border:none; border-radius:5px; cursor:pointer; }
  .btn-submit { background:#10b981; color:white; }
  .btn-reject { background:#ef4444; color:white; }
</style>
</head>
<body>

<header>✅ User Task</header>

<div id="taskContainer">
  <!-- Firebase দিয়ে Task Requests লোড হবে -->
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBEbzvJ5asGNPp85_Uyvk1N_TCjIBfECXY",
  authDomain: "studentbestincome.firebaseapp.com",
  databaseURL: "https://studentbestincome-default-rtdb.firebaseio.com",
  projectId: "studentbestincome",
  storageBucket: "studentbestincome.appspot.com",
  messagingSenderId: "261636758539",
  appId: "1:261636758539:web:faea7afabe319a53117b0e",
  measurementId: "G-6L77EJ7MJF"
};

firebase.initializeApp(firebaseConfig);

// Admin Login
const adminEmail = "admin@example.com";
const adminPass = "Dark";

firebase.auth().signInWithEmailAndPassword(adminEmail, adminPass)
  .then(() => {
    console.log("Admin logged in!");
    loadTasks();
  })
  .catch(err => console.error("Login Error:", err.message));

// Load User Tasks
function loadTasks() {
  const dbRef = firebase.database().ref('tasks'); // Task requests path
  dbRef.on('value', snapshot => {
    const tasks = snapshot.val();
    const container = document.getElementById('taskContainer');
    container.innerHTML = '';

    for (let taskId in tasks) {
      const task = tasks[taskId];
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <p><strong>User:</strong> ${task.userName || '-'}</p>
        <p><strong>Task:</strong> ${task.taskName || '-'}</p>
        <p><strong>Contact:</strong> ${task.contact || '-'}</p>
        <div style="display:flex;">
          <div>
            <p>Screenshot 1:</p>
            <img src="${task.screenshot1 || '#'}" alt="Screenshot1">
          </div>
          <div>
            <p>Screenshot 2:</p>
            <img src="${task.screenshot2 || '#'}" alt="Screenshot2">
          </div>
        </div>
        <button class="btn btn-submit" onclick="updateTask('${taskId}', 'Submitted')">Submit</button>
        <button class="btn btn-reject" onclick="updateTask('${taskId}', 'Rejected')">Reject</button>
      `;
      container.appendChild(card);
    }
  });
}

// Update Task Status
function updateTask(taskId, status) {
  firebase.database().ref('tasks/' + taskId).update({ status: status })
    .then(() => alert('Task ' + status + '!'))
    .catch(err => alert('Error: ' + err.message));
}
</script>

</body>
</html>
