<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broadcast Messages - Admin Panel</title>
<style>
  body { font-family: Arial, sans-serif; background: #f3f4f6; padding: 20px; }
  h1 { color: #3b82f6; text-align: center; margin-bottom: 20px; }
  textarea { width: 100%; padding: 10px; font-size: 16px; }
  button { padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
  ul { margin-top: 20px; list-style: none; padding: 0; }
  li { background: #e0f2fe; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
</style>
</head>
<body>

<h1>📢 Broadcast Messages</h1>

<textarea id="broadcastInput" placeholder="Type your broadcast message here..."></textarea>
<button id="sendBtn">Send Broadcast</button>

<h2>Sent Broadcasts</h2>
<ul id="broadcastList">
  <!-- Firebase Broadcasts will appear here -->
</ul>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyBEbzvJ5asGNPp85_Uyvk1N_TCjIBfECXY",
    authDomain: "studentbestincome.firebaseapp.com",
    databaseURL: "https://studentbestincome-default-rtdb.firebaseio.com",
    projectId: "studentbestincome",
    storageBucket: "studentbestincome.firebasestorage.app",
    messagingSenderId: "261636758539",
    appId: "1:261636758539:web:faea7afabe319a53117b0e",
    measurementId: "G-6L77EJ7MJF"
  };

  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const input = document.getElementById("broadcastInput");
  const sendBtn = document.getElementById("sendBtn");
  const list = document.getElementById("broadcastList");

  // Send Broadcast
  sendBtn.onclick = () => {
    const msg = input.value.trim();
    if(msg) {
      const newRef = db.ref("broadcast").push();
      newRef.set({
        message: msg,
        timestamp: new Date().toISOString()
      });
      input.value = "";
    }
  };

  // Listen for Broadcasts
  db.ref("broadcast").on("value", snapshot => {
    list.innerHTML = "";
    snapshot.forEach(child => {
      const data = child.val();
      const li = document.createElement("li");
      li.textContent = `${data.message} (${new Date(data.timestamp).toLocaleString()})`;
      list.appendChild(li);
    });
  });
</script>

</body>
</html>
