<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin - User List</title>
<script type="module">
  // Import Firebase SDK
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBEbzvJ5asGNPp85_Uyvk1N_TCjIBfECXY",
    authDomain: "studentbestincome.firebaseapp.com",
    databaseURL: "https://studentbestincome-default-rtdb.firebaseio.com",
    projectId: "studentbestincome",
    storageBucket: "studentbestincome.firebasestorage.app",
    messagingSenderId: "261636758539",
    appId: "1:261636758539:web:faea7afabe319a53117b0e",
    measurementId: "G-6L77EJ7MJF"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.addEventListener("DOMContentLoaded", () => {
    const userTable = document.getElementById("userTable");

    // ফাংশন: UI আপডেট
    function renderUsers(usersData) {
      userTable.innerHTML = "";
      Object.keys(usersData).forEach(uid => {
        const user = usersData[uid];
        const tr = document.createElement("tr");
        tr.className = "hover:bg-gray-700";
        tr.innerHTML = `
          <td class="px-4 py-3">${user.name}</td>
          <td class="px-4 py-3">${user.username}</td>
          <td class="px-4 py-3">${user.email}</td>
          <td class="px-4 py-3">
            <input type="number" id="bal-${uid}" value="${user.balance || 0}" class="bg-gray-700 text-white w-24 px-2 py-1 rounded">
          </td>
          <td class="px-4 py-3 text-center space-x-2">
            <button onclick="updateBalance('${uid}')" class="bg-blue-500 hover:bg-blue-600 px-3 py-1 rounded">Update</button>
            <button onclick="suspendUser('${uid}')" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded">Suspend 24h</button>
          </td>
        `;
        userTable.appendChild(tr);
      });
    }

    // Firebase থেকে রিয়েলটাইম ইউজার ডেটা
    const usersRef = ref(db, 'users');
    onValue(usersRef, snapshot => {
      const data = snapshot.val();
      if(data) renderUsers(data);
    });

    // ব্যালেন্স আপডেট
    window.updateBalance = (uid) => {
      const newBal = parseFloat(document.getElementById(`bal-${uid}`).value) || 0;
      update(ref(db, `users/${uid}`), { balance: newBal })
        .then(() => alert(`✅ ইউজার ${uid} এর ব্যালেন্স আপডেট হয়েছে: ${newBal}৳`))
        .catch(err => alert("❌ ব্যালেন্স আপডেট করতে সমস্যা: "+err));
    }

    // Suspend 24h
    window.suspendUser = (uid) => {
      const until = Date.now() + 24*60*60*1000; // 24h মিলে মিলিসেকেন্ড
      update(ref(db, `users/${uid}`), { suspendedUntil: until })
        .then(() => alert(`🚫 ইউজার ${uid} ২৪ ঘন্টার জন্য সাসপেন্ড করা হয়েছে`))
        .catch(err => alert("❌ সাসপেন্ড করতে সমস্যা: "+err));
    }
  });
</script>

<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen">
<header class="bg-gray-800 py-4 shadow-md">
  <h1 class="text-center text-2xl font-bold">👥 ইউজার লিস্ট (Manage Users)</h1>
</header>

<main class="p-6 overflow-x-auto">
  <table class="min-w-full bg-gray-800 rounded-lg shadow-lg">
    <thead>
      <tr class="bg-gray-700 text-left text-sm uppercase">
        <th class="px-4 py-3">নাম</th>
        <th class="px-4 py-3">ইউজারনেম</th>
        <th class="px-4 py-3">ইমেইল</th>
        <th class="px-4 py-3">ব্যালেন্স (৳)</th>
        <th class="px-4 py-3 text-center">অ্যাকশন</th>
      </tr>
    </thead>
    <tbody id="userTable" class="divide-y divide-gray-700"></tbody>
  </table>
</main>
</body>
</html>
